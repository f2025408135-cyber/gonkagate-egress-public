name: probe-chat

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe gonkagate from fresh IP
        env:
          GONKA_PROBE_KEY: ${{ secrets.GONKA_PROBE_KEY }}
        run: node scripts/probe-chat.mjs